services:
  mysql:
    image: mysql:8.4
    container_name: savesmart-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: savesmart
      MYSQL_USER: savesmart
      MYSQL_PASSWORD: savesmart_dev
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports:
      - "3306:3306"
    volumes:
      - savesmart_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_dev_only"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  savesmart_data:
