spring.application.name=savesmart-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/savesmart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:savesmart}
spring.datasource.password=${DB_PASSWORD:savesmart_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# HTTP Basic is used for this learning MVP. Never use default development credentials in production.
